<div class="row">
  <div class="col">
    <ul class="nav justify-content-end">
      @for (lang of getLangs(); track lang) {
        <li class="nav-item">
          <button type="button" [ngClass]="getLang() === lang ? 'nav-link fw-bold' : 'nav-link'"
          (click)="setLang(lang)">{{lang}}</button>
        </li>
      }
    </ul>
  </div>
</div>
